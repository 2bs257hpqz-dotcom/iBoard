name: Build iOS IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Archive
        run: |
          xcodebuild archive -project iBoard.xcodeproj -scheme iBoard -archivePath iBoard.xcarchive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive -archivePath iBoard.xcarchive -exportOptionsPlist exportOptions.plist -exportPath ./output

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iBoard-IPA
          path: ./output/*.ipa
